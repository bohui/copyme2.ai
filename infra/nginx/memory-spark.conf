server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /static/ {
        alias /usr/share/nginx/html/;
    }

    location /app/ {
        alias /usr/share/nginx/app/;
    }

    location /v1/ {
        proxy_pass ${MEMORY_SPARK_API_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/memoir {
        proxy_pass ${MEMORY_SPARK_API_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/memoir/ {
        proxy_pass ${MEMORY_SPARK_API_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass ${MEMORY_SPARK_API_ORIGIN}/health;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass ${MEMORY_SPARK_API_ORIGIN}/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass ${MEMORY_SPARK_API_ORIGIN}/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
