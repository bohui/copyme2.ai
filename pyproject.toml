[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-spark"
version = "1.0.0"
description = "Evidence-linked guided memoir application"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1,<1",
  "fastapi>=0.141.1,<1",
  "uvicorn[standard]>=0.53.0,<1",
  "pydantic>=2.13.5,<3",
  "temporalio>=1.33.0,<2",
]

[tool.setuptools]
packages = ["apps", "apps.api"]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1,<10",
  "httpx>=0.28.1,<1",
  "playwright>=1.63.0,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
