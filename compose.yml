name: memory-spark

networks:
  default:
    # Apple Container attaches one network per container. The connected stack
    # therefore uses the provider's external network as its default network.
    external: true
    name: ${MEMORY_SPARK_LLM_NETWORK:-llm-provider-llm-network}

services:
  api:
    image: localhost/memory-spark:dev
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "${MEMORY_SPARK_API_PORT:-8010}:8000"
    environment:
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      GOOGLE_MAPS_GEOCODING_API_KEY: ${GOOGLE_MAPS_GEOCODING_API_KEY:-}
      GOOGLE_MAPS_GEOCODING_URL: ${GOOGLE_MAPS_GEOCODING_URL:-https://maps.googleapis.com/maps/api/geocode/json}
      GOOGLE_MAPS_BROWSER_API_KEY: ${GOOGLE_MAPS_BROWSER_API_KEY:-}
      # Public engine ID plus server-only JSON API key for paged image search.
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-b2de41f6592f74c3e}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_URL: ${GOOGLE_CSE_URL:-}
      MEMORY_SPARK_MODE: ${MEMORY_SPARK_MODE:-demo}
      MEMORY_SPARK_ENTITLEMENT_MODEL: ${MEMORY_SPARK_ENTITLEMENT_MODEL:-chapter}
      MEMORY_SPARK_SHOW_THINKING_STEPS: ${MEMORY_SPARK_SHOW_THINKING_STEPS:-0}
      MEMORY_SPARK_FREE_RECALL_ROUNDS: ${MEMORY_SPARK_FREE_RECALL_ROUNDS:-20}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ELECTRONIC: ${STRIPE_PRICE_ELECTRONIC:-}
      STRIPE_PRICE_PRINTED: ${STRIPE_PRICE_PRINTED:-}
      STRIPE_PRICE_FAMILY: ${STRIPE_PRICE_FAMILY:-}
      STRIPE_PRICE_ADDITIONAL_BOOK: ${STRIPE_PRICE_ADDITIONAL_BOOK:-}
      MEMORY_SPARK_PUBLIC_URL: ${MEMORY_SPARK_PUBLIC_URL:-http://localhost:3010}
      MEMORY_SPARK_PRINT_COUNTRIES: ${MEMORY_SPARK_PRINT_COUNTRIES:-AU}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
      # Mocker does not publish cross-project DNS aliases; 192.168.68.1 is
      # the gateway for the external llm-provider network and forwards port 4000.
      MEMORY_SPARK_LLM_BASE_URL: ${MEMORY_SPARK_LLM_BASE_URL:-http://192.168.68.1:4000/v1}
      MEMORY_SPARK_LLM_MODEL: ${MEMORY_SPARK_LLM_MODEL:-deepseek-v4-flash}
      MEMORY_SPARK_LLM_API_KEY: ${MEMORY_SPARK_LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      MEMORY_SPARK_STT_MODEL: ${MEMORY_SPARK_STT_MODEL:-gpt-4o-mini-transcribe}
      MEMORY_SPARK_TTS_MODEL: ${MEMORY_SPARK_TTS_MODEL:-gpt-4o-mini-tts}
      MEMORY_SPARK_REALTIME_MODEL: ${MEMORY_SPARK_REALTIME_MODEL:-gpt-realtime-2.1}
      MEMORY_SPARK_REALTIME_VOICE: ${MEMORY_SPARK_REALTIME_VOICE:-marin}
      MEMORY_SPARK_CODEX_WORKER_URL: http://codex-worker:8766
      MEMORY_SPARK_CODEX_WORKER_SECRET: ${MEMORY_SPARK_CODEX_WORKER_SECRET:-memory-spark-local-worker-secret}
      MEMORY_SPARK_PHOTO_WORKER_URL: http://photo-worker:8767
      MEMORY_SPARK_PHOTO_WORKER_SECRET: ${MEMORY_SPARK_PHOTO_WORKER_SECRET:-memory-spark-local-photo-secret}
      MEMORY_SPARK_REGION: ${MEMORY_SPARK_REGION:-au}
      MEMORY_SPARK_OBJECT_STORE_PATH: /var/lib/memory-spark/objects
      MEMORY_SPARK_TASK_DB: /var/lib/memoir-tasks/tasks.sqlite
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./apps/api:/app/apps/api:ro
      - ./apps/web/public:/app/apps/web/public:ro
      - ./Mira_Memoir_Journalist_System_Prompt_v1.0.md:/app/Mira_Memoir_Journalist_System_Prompt_v1.0.md:ro
      - ./docs:/app/docs:ro
      - ./var/memory-spark:/var/lib/memory-spark
      - memoir-tasks:/var/lib/memoir-tasks
    depends_on:
      codex-worker:
        condition: service_healthy
      photo-worker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  photo-worker:
    image: localhost/memory-spark:dev
    build:
      context: .
      dockerfile: Containerfile
    command: ["uvicorn", "apps.api.photo_worker_service:app", "--host", "0.0.0.0", "--port", "8767"]
    expose: ["8767"]
    init: true
    mem_limit: 2g
    environment:
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-b2de41f6592f74c3e}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_URL: ${GOOGLE_CSE_URL:-}
      MEMORY_SPARK_PHOTO_WORKER_SECRET: ${MEMORY_SPARK_PHOTO_WORKER_SECRET:-memory-spark-local-photo-secret}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./apps/api:/app/apps/api:ro
      - ./skills/place-photo-research:/app/skills/place-photo-research:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  codex-worker:
    image: localhost/memory-spark-codex-worker:dev
    build:
      context: .
      dockerfile: codex-worker/Containerfile
      args:
        CODEX_VERSION: ${MEMORY_SPARK_CODEX_VERSION:-0.156.1}
    expose:
      - "8766"
    environment:
      CODEX_HOME: /var/lib/memory-spark/codex-users
      MEMORY_SPARK_CODEX_HOME: /var/lib/memory-spark/codex-users
      MEMORY_SPARK_LEGACY_CODEX_HOME: /var/lib/memory-spark/legacy-codex-users
      MEMORY_SPARK_TASK_STORE_URL: http://api:8000
      MEMORY_SPARK_CODEX_WORKER_SECRET: ${MEMORY_SPARK_CODEX_WORKER_SECRET:-memory-spark-local-worker-secret}
      MEMORY_SPARK_LLM_BASE_URL: ${MEMORY_SPARK_LLM_BASE_URL:-http://192.168.68.1:4000/v1}
      MEMORY_SPARK_LLM_MODEL: ${MEMORY_SPARK_LLM_MODEL:-deepseek-v4-flash}
      MEMORY_SPARK_LLM_API_KEY: ${MEMORY_SPARK_LLM_API_KEY:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - codex-worker-home:/var/lib/memory-spark/codex-users
      # Read only for one-time import; stop the old API before upgrading.
      - ./var/memory-spark/codex-users:/var/lib/memory-spark/legacy-codex-users:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      # The root supervisor must terminate/reap its different-UID children.
      - KILL
      - SETGID
      - SETUID
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health').read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  worker:
    image: localhost/memory-spark:dev
    build:
      context: .
      dockerfile: Containerfile
    environment:
      MEMORY_SPARK_MODE: ${MEMORY_SPARK_MODE:-demo}
      MEMORY_SPARK_REGION: ${MEMORY_SPARK_REGION:-au}
      MEMORY_SPARK_OBJECT_STORE_PATH: /var/lib/memory-spark/objects
      MEMORY_SPARK_WORKER_ID: ${MEMORY_SPARK_WORKER_ID:-memory-spark-worker}
      MEMORY_SPARK_TASK_DB: /var/lib/memoir-tasks/tasks.sqlite
      MEMORY_SPARK_TEMPORAL_ADDRESS: temporal:7233
      MEMORY_SPARK_TEMPORAL_NAMESPACE: default
      MEMORY_SPARK_TEMPORAL_TASK_QUEUE: memoir-tasks
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./apps/api:/app/apps/api:ro
      - ./scripts:/app/scripts:ro
      - ./var/memory-spark:/var/lib/memory-spark
      - memoir-tasks:/var/lib/memoir-tasks
    depends_on:
      temporal:
        condition: service_healthy
    command: ["python", "scripts/worker.py", "--interval", "2"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - scripts/worker.py
        - --readiness
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  temporal:
    image: temporalio/temporal@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/var/lib/temporal/temporal.sqlite"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/var/lib/temporal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    image: localhost/copyme2-web:dev
    build:
      context: ./apps/web
      dockerfile: Containerfile
      args:
        MEMORY_SPARK_API_ORIGIN: "http://api:8000"
    ports:
      - "${MEMORY_SPARK_WEB_PORT:-3010}:3000"
    environment:
      MEMORY_SPARK_API_PORT: "${MEMORY_SPARK_API_PORT:-8010}"
      MEMORY_SPARK_API_ORIGIN: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

volumes:
  codex-worker-home:
  memoir-tasks:
  temporal-data:
